<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turgeneva, 4 Navigator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lang">
        <a href="index.html">
            <img src="images/ru.png" style="width:40px; padding-right:10px">
        </a>
        <a href="index-ch.html">
            <img src="images/ch.png" style="width:40px; padding-right:10px">
        </a>      
    </div>

    <h1>Welcome to the<br>Navigator for the UrFU Campus on Turgeneva 4!</h1>
    <h2>Find a route</h2><br>
    <div class="search-container">
        <div class="search-box">
            <label for="search1">From:</label>
            <input type="text" id="search1" placeholder="Room number or name" autocomplete="off">
            <div class="dropdown" id="dropdown1"></div>
        </div>
        <div class="search-box">
            <label for="search2">To:</label>
            <input type="text" id="search2" placeholder="Room number or name" autocomplete="off">
            <div class="dropdown" id="dropdown2"></div>
        </div>
    </div>
    <button class="btn" id="showBtn">Find</button>
    <div class="status" id="status">Choose two rooms from the list</div>

    <div id="results">
        <div id="resultContent"></div>
    </div><br><br><br>

    <h2>Or choose a floor</h2><br>
    <div id="floors_select">
        <a href="0floor-en.html">
            <img src="images/T_icon.png">
        </a>
        <a href="1floor-en.html">
            <img src="images/1_icon.png">
        </a>
        <a href="2floor-en.html">
            <img src="images/2_icon.png">
        </a>
        <a href="3floor-en.html">
            <img src="images/3_icon.png">
        </a>
        <a href="4floor-en.html">
            <img src="images/4_icon.png">
        </a>
        <a href="5floor-en.html">
            <img src="images/5_icon.png">
        </a>
        <a href="6floor-en.html">
            <img src="images/6_icon.png">
        </a>
    </div>


    <script src="script_en.js"></script>

</body>
</html>
